[project]
name = "langchain-multi-agent-research-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ashutosh_Kumar", email = "kumarashutosh5689@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "langchain>=1.4.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.4",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langchain-tavily>=0.2.18",
    "lxml>=6.1.3",
    "python-dotenv>=1.2.4",
    "readability-lxml>=0.9",
    "requests>=2.34.2",
    "streamlit>=1.67.0",
    "trafilatura>=2.3.1",
]

[project.scripts]
langchain-multi-agent-research-system = "langchain_multi_agent_research_system:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
